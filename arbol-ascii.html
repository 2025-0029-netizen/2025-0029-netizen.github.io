<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <meta name="description" content="A cinematic rotating 3D Christmas tree, made from thousands of glowing ASCII characters. Pure HTML, CSS and JavaScript." />
  <title>ASCII Christmas — Golden Starlight Edition</title>
  <style>
    :root { color-scheme: dark; --frost:#d9eae6; --gold:#f4cc8b; }
    * { box-sizing: border-box; }
    html, body { width:100%;height:100%;margin:0;overflow:hidden; }
    body { background:#050b14; color:var(--frost); font-family:Consolas,'Courier New',monospace; }
    canvas { display:block;width:100%;height:100%;touch-action:manipulation; }
    .ui { position:fixed;inset:0;z-index:3;pointer-events:none; }
    .eyebrow { position:absolute;top:clamp(17px,4vh,34px);left:clamp(17px,4vw,49px);
      display:flex;align-items:center;gap:12px;font-size:clamp(8px,.8vw,11px);
      letter-spacing:.22em;color:#8da8ae;opacity:.8; }
    .eyebrow .diamond {display:inline-block;width:5px;height:5px;background:#dec38e;transform:rotate(45deg);box-shadow:0 0 10px #e7cb9188;}
    .toolbar { position:absolute;top:clamp(12px,3.2vh,28px);right:clamp(14px,3.5vw,45px);
      display:flex;gap:8px;pointer-events:auto; }
    button {padding:10px 14px;min-height:36px;color:#c1d9d7;background:#07131ccf;
      border:1px solid #a1beb439;border-radius:3px;font-family:inherit;font-size:10px;
      letter-spacing:.13em;cursor:pointer;transition:background .18s,border-color .18s,color .18s;}
    button:hover {background:#12232b;border-color:#b6d8cd8a;color:#ffffff;}
    button:focus-visible {outline:2px solid var(--gold);outline-offset:3px;}
    .footer {position:absolute;left:0;right:0;bottom:clamp(18px,5vh,46px);text-align:center;
      opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease;
      padding:0 12px;pointer-events:none;}
    .footer.visible {opacity:1;transform:translateY(0);}
    .rule {height:1px;width:clamp(35px,8vw,100px);margin:0 auto 15px;
      background:linear-gradient(90deg,transparent,#bca07193,transparent);}
    .footer h1 {font-family:Georgia,'Times New Roman',serif;font-size:clamp(15px,2.4vw,26px);
      font-weight:400;margin:0;letter-spacing:.24em;padding-left:.24em;
      color:#f7e7c9;text-shadow:0 0 26px #fbc57b55;}
    .footer p {font-size:clamp(8px,.75vw,10px);letter-spacing:.26em;color:#90afb0;
      margin:11px 0 0;text-transform:uppercase;}
    .stage {position:absolute;left:clamp(17px,4vw,49px);bottom:clamp(18px,4vh,38px);
      color:#789499;font-size:clamp(8px,.72vw,10px);letter-spacing:.12em;
      transition:opacity 1s ease;}
    .stage.done {opacity:.38;}
    .stage em {font-style:normal;color:#d9bd81;}
    .loadingline {position:absolute;bottom:0;left:0;width:100%;height:1px;background:#26354033;}
    .loadingline>div {height:100%;width:0;background:linear-gradient(90deg,#7fbca9,#edd7a5);box-shadow:0 0 10px #b5d7bc;transition:width .11s linear;}
    @media (max-width:680px) {
      .eyebrow {top:19px;left:15px;font-size:8px;letter-spacing:.09em;gap:7px;}
      .toolbar {top:12px;right:12px;gap:6px;}
      button {padding:9px 8px;min-height:32px;font-size:9px;letter-spacing:.04em;}
      .footer {bottom:9vh;}
      .footer h1 {font-size:17px;letter-spacing:.14em;padding-left:.14em;}
      .footer p {font-size:8px;letter-spacing:.12em;}
      .stage {bottom:18px;left:15px;font-size:8px;}
    }
    @media (prefers-reduced-motion:reduce) { .footer,.stage,.loadingline>div {transition:none;} }
  </style>
</head>
<body>
  <audio id="bg-music" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
  <canvas id="ascii" role="img" aria-label="An evergreen Christmas tree built from glowing ASCII characters grows from the ground upward, wraps itself in a red and gold ribbon, lights up with ornaments, reveals three petite differently-sized gifts and forms a medium-sized rotating golden star. It then rotates with continuous snowfall."></canvas>
  <div class="ui">
    <div class="eyebrow"><span class="diamond"></span><span>ASCII ART &nbsp;/&nbsp; GOLDEN STARLIGHT</span></div>
    <div class="toolbar">
      <button id="pause" type="button" aria-label="Pause animation">PAUSE</button>
      <button id="replay" type="button" aria-label="Restart the Christmas animation">↻ REPLAY</button>
    </div>
    <div class="stage" id="stage"><em>01</em> &nbsp; AWAKENING THE FOREST</div>
    <div class="footer" id="footer"><div class="rule"></div><h1>MERRY CHRISTMAS</h1><p>A winter night, written in light</p></div>
    <div class="loadingline"><div id="loading"></div></div>
  </div>
<script>
(() => {
  'use strict';
  /*
   *  ASCII WINTER LIGHT — SINGLE FILE / NO EXTERNAL LIBRARIES
   *  -------------------------------------------------------
   *  Every visible object (tree, needles, ribbon, ornaments,
   *  gift boxes, star, snowfall) consists of rendered ASCII glyphs.
   *  A tiny software 3D renderer projects thousands of character
   *  particles to a grid and uses a depth buffer for occlusion.
   *
   *  PERFORMANCE: cap density and FPS for smaller mobile devices.
   *  CUSTOMIZE: start by editing SETTINGS and COLORS below.
   *
   *  EXACTLY THREE SMALL GIFTS: two on the left, one on the right.
   *  DELUXE STAGES: white frost growth, ribbon threading, individually
   *  illuminated baubles, three gift reveals, comet, spinning medium star.
   *  Each pixel of the main scene is a character, not a 3D model or image.
   */
  const canvas = document.getElementById('ascii');
  const g = canvas.getContext('2d', {alpha:false});
  const pauseBtn = document.getElementById('pause');
  const replayBtn = document.getElementById('replay');
  const stage = document.getElementById('stage');
  const footer = document.getElementById('footer');
  const loading = document.getElementById('loading');
  const TAU = 2*Math.PI;
  const SETTINGS = {
    height:6.15,
    baseRadius:2.54,
    needleCount:30000,
    baubleCount:68,
    snowCount:295,
    starsCount:290,
    rotationSeconds:37,
    starRotationSeconds:22,
    starRollSeconds:27,
    targetFPS:35,
    seed:25122026,
    beats:{
      seed:0.25,
      trunk:0.40,
      buildStart:0.70,
      buildEnd:6.45,
      ribbonStart:6.0,
      ribbonEnd:9.60,
      lightsStart:8.65,
      lightsEnd:12.15,
      giftsStart:11.15,
      cometStart:13.15,
      starStart:14.90,
      starEnd:16.75,
      textStart:17.35
    }
  };
  const COLORS = [
    '#0b452d', // 0 shadow pine
    '#0c633c', // 1 deep pine
    '#117849', // 2 green
    '#198c52', // 3 vivid green
    '#32a765', // 4 bright needle
    '#64bb88', // 5 emerald shimmer
    '#bddbd4', // 6 white frost shaded
    '#effff9', // 7 dazzling white frost
    '#fffefa', // 8 pure growth glow
    '#88422f', // 9 red velvet shadow
    '#b83e4b', // 10 ruby
    '#fa6371', // 11 red highlight
    '#9e733e', // 12 gold shadow
    '#d8a65c', // 13 champagne gold
    '#f5d89c', // 14 warm gleam
    '#fff1cf', // 15 star white gold
    '#3a82a2', // 16 glacial blue
    '#84d9e8', // 17 icy glow
    '#af7189', // 18 vintage pink
    '#ffd3dd', // 19 rose glow
    '#6d938a', // 20 sage green
    '#cce8d1', // 21 mint highlight
    '#a57e54', // 22 gift cardboard gold
    '#f0c384'  // 23 pale gold ribbon
  ];
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
  const ease=x=>1-Math.pow(1-clamp(x),3);
  const p=(t,a,b)=>smooth((t-a)/(b-a));
  const fract=x=>x-Math.floor(x);
  function rngFactory(seed){return ()=>{seed|=0;seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;
    return((t^t>>>14)>>>0)/4294967296;};}
  const random=rngFactory(SETTINGS.seed);
  const choose=arr=>arr[Math.floor(random()*arr.length)];
  const surfaceGlyphs='WwVvXx#%&*+^';
  const icyGlyphs='#*+xW%';
  const sparkGlyphs=['.','.','+','*'];
  const tree=[],tips=[],ribbon=[],bulbs=[],boxes=[],starShape=[],trunk=[];
  const fairyLights=[],branchSparks=[],starDust=[],frontCrystals=[];
  let W=0,H=0,dpr=1,font=9,CW=5,CH=10,ncols=0,nrows=0,scale=60,base=0,center=0;
  let gridChars=[],gridColors,gridDepth,gridGlow;
  let snow=[],sky=[],ground=[],floating=[];
  let gradient=null,velvetGlow=null,rotation=0,sinR=0,cosR=1;
  let tick=0,previous=0,lastRender=0,playing=true,mouseX=0,mouseY=0,renderNumber=0,lastStage=-1;

  function radius(y){
    const u=clamp(y/SETTINGS.height);
    // Silhouette tapers gently; stepped scallops create actual fir branches.
    const scallop=1+.028*Math.sin(u*66)+.012*Math.sin(u*122+1);
    return SETTINGS.baseRadius*Math.pow(1-u,.91)*scallop;
  }

  function constructTree(){
    // Dense 3D surface made from real printable letters. The randomization is
    // deterministic: the same tree appears every time you press REPLAY.
    for(let i=0;i<SETTINGS.needleCount;i++){
      const u=1-Math.sqrt(random());
      const y=.33 + u*(SETTINGS.height-.35);
      const a=random()*TAU;
      const outward=.73+.29*Math.sqrt(random());
      const tier=.067*Math.sin(y*14.4)+.022*Math.sin(y*41+a*9);
      const r=radius(y)*Math.max(.1,outward+tier);
      const x=r*Math.cos(a),z=r*Math.sin(a);
      const edge=outward>.91;
      const frosted=(edge && random()<.1 && Math.sin(y*13.4+a*.5)>.22)
        || (y>SETTINGS.height-.21 && random()<.52);
      tree.push({x,y:y+.045*Math.sin(a*8+y*18),z,
        ch:choose(frosted?icyGlyphs:surfaceGlyphs),
        frost:frosted,rand:random(),phase:random()*TAU});
    }
    // Fir silhouette branches, drooping naturally at their tips.
    for(let level=0;level<35;level++){
      const y=.48+level*(SETTINGS.height-.55)/35;
      const R=radius(y);
      const arms=25+Math.floor(23*(1-y/SETTINGS.height));
      for(let arm=0;arm<arms;arm++){
        const a=arm*TAU/arms+level*.73;
        const len=R*(.79+.2*random());
        for(let j=0;j<13;j++){
          const u=j/12;
          const phi=a+.075*Math.sin(u*10+a*4)+.015*(random()-.5);
          const rr=len*u;
          const yy=y-.17*u*u+.032*(random()-.5);
          const icy=j>9 && random()<.34;
          tree.push({x:rr*Math.cos(phi),y:yy,z:rr*Math.sin(phi),
            ch:choose(icy?icyGlyphs:surfaceGlyphs),frost:icy,rand:random(),phase:random()*TAU});
        }
      }
    }
    // Long needle-tip glimmers pointing slightly upwards.
    for(let i=0;i<800;i++){
      const y=.38+random()*(SETTINGS.height-.38),a=random()*TAU;
      const r=radius(y)*(1+random()*.07);
      tips.push({x:r*Math.cos(a),y,z:r*Math.sin(a),seed:random(),phase:random()*TAU});
    }
    // Tiny ice crystals appear behind the advancing growth seam. Each
    // crystal is a light-weight character with its own delay and lifespan.
    for(let i=0;i<390;i++){
      const y=.46+random()*(SETTINGS.height-.48);
      const a=random()*TAU;
      const r=radius(y)*(1.02+random()*.26);
      frontCrystals.push({x:r*Math.cos(a),y,z:r*Math.sin(a),
        delay:random()*.4,phase:random()*TAU,seed:random()});
    }
    // Independent sparkle constellation following a helix around the foliage.
    for(let i=0;i<125;i++){
      const y=.55+(SETTINGS.height-.77)*random();
      const a=random()*TAU;
      const r=radius(y)+.14+random()*.34;
      branchSparks.push({x:r*Math.cos(a),y,z:r*Math.sin(a),
        phase:random()*TAU,rate:.9+random()*1.9,delay:random()*3});
    }
    // Trunk is a character cylinder; mostly concealed by foliage.
    for(let y=.07;y<.72;y+=.045)for(let a=0;a<TAU;a+=.21){
      trunk.push({x:Math.cos(a)*.15,y,z:Math.sin(a)*.15,ch:choose('|#H')});
    }
    // THREE-dimensional ribbon. Main velvet red stripe with thin gold
    // glistening edges; 4.35 turns around the conical tree.
    const loops=4.35;
    for(let i=0;i<2400;i++){
      const q=i/2399;
      const y=.68+q*(SETTINGS.height-.98);
      const a=q*TAU*loops+.38;
      const rad=radius(y)+.09;
      for(let lane=-2;lane<=2;lane++){
        const yy=y+lane*.036;
        const aa=a+lane*.012;
        const rr=rad+.009*(lane===0);
        ribbon.push({x:rr*Math.cos(aa),y:yy,z:rr*Math.sin(aa),q,lane,
          ch:lane===-2||lane===2 ? choose(['=','+','*']) : choose(['@','#','%','=','@'])});
      }
    }
    // Small pearl LEDs are woven into the spiral, separate from the larger
    // glass baubles. They ignite in a chase pattern once the ribbon is ready.
    for(let i=0;i<116;i++){
      const q=(i+.35)/116;
      const y=.68+q*(SETTINGS.height-.98);
      const a=q*TAU*4.35+.38;
      const r=radius(y)+.15;
      fairyLights.push({x:r*Math.cos(a),y,z:r*Math.sin(a),q,
        phase:random()*TAU,color:i%7===0?17:i%5===0?11:15});
    }
    // Real ASCII baubles (a little circular constellation of characters each).
    const ornamentColors=[10,10,13,13,14,16,17,18,20,14,19,13];
    for(let i=0;i<SETTINGS.baubleCount;i++){
      const y=.69+(SETTINGS.height-1.1)*Math.sqrt(random());
      const a=random()*TAU;
      const r=radius(y)+.18;
      bulbs.push({x:r*Math.cos(a),y,z:r*Math.sin(a),
        color:choose(ornamentColors),phase:random()*TAU,start:random()*.88,
        size:random()<.22?2:random()<.62?1:0,
        flare:random()*TAU,rate:2.2+random()*1.6});
    }
    // Exactly THREE differently sized gifts: two to the left, one to the right.
    // The boxes do not rotate; the tree does, as in a staged winter display.
    const layout=[
      // All three are intentionally petite so the character tree stays hero.
      {x:-2.60,z:1.70,w:.77,h:.65,d:.55,body:10,edge:11,band:14},  // left: small ruby
      {x:-1.63,z:2.10,w:.51,h:.42,d:.45,body:22,edge:23,band:19},  // left: tiny champagne
      {x:2.60,z:1.78,w:.67,h:.56,d:.54,body:20,edge:21,band:14}    // right: small sage
    ];
    for(let b=0;b<layout.length;b++){
      const o=layout[b],v=[];
      // Five visible box faces, voxelized at uniform character spacing.
      for(let face=0;face<5;face++){
        const nx=Math.round(o.w*19),ny=Math.round(o.h*17);
        for(let i=0;i<=nx;i++)for(let j=0;j<=ny;j++){
          const u=i/nx-.5,k=j/ny;
          let x,y,z;
          if(face===0){x=u*o.w;y=k*o.h;z=o.d/2;}
          else if(face===1){x=o.w/2;y=k*o.h;z=u*o.d;}
          else if(face===2){x=-o.w/2;y=k*o.h;z=u*o.d;}
          else if(face===3){x=u*o.w;y=o.h;z=(k-.5)*o.d;}
          else {x=u*o.w;y=k*o.h;z=-o.d/2;}
          const band=Math.abs(x)<o.w*.10||(face===3&&Math.abs(z)<o.d*.10);
          const outline=face===0&&(i===0||i===nx||j===0||j===ny);
          v.push({x:o.x+x,y:y+.02,z:o.z+z,
            ch:band?choose(['@','=','%']):choose(['X','x','#','W','%']),
            col:band?o.band:outline?o.edge:o.body});
        }
      }
      // A ribbon lid seam across the top and a tiny raised bow.
      // Unlike CSS gift icons, both are ASCII glyph particles in 3D space.
      for(let j=0;j<60;j++){
        const u=j/59-.5;
        v.push({x:o.x+u*o.w,y:o.h+.025,z:o.z+o.d*.36,
          ch:j%4===0?'*':'=',col:o.band});
      }
      for(let loop=-1;loop<=1;loop+=2){
        for(let j=0;j<96;j++){
          const a=j*TAU/96;
          v.push({x:o.x+loop*.066+Math.cos(a)*.075,
            y:o.h+.055+Math.sin(a)*.059,z:o.z+o.d*.19+Math.sin(a*2)*.027,
            ch:choose(['@','%','+']),col:o.band});
        }
      }
      v.push({x:o.x,y:o.h+.057,z:o.z+o.d*.22,ch:'@',col:15});
      boxes.push({voxels:v,location:o});
    }
    // Actual five point star, generated as an ASCII polygon raster mask.
    // The mask is character-based, never drawn as a solid geometric shape.
    const pts=[];
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5,rad=(i%2)?.42:1;
      pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad});
    }
    const inside=(x,y)=>{let n=false;for(let i=0,j=9;i<10;j=i++){
      const A=pts[i],B=pts[j];
      if((A.y>y)!==(B.y>y) && x<(B.x-A.x)*(y-A.y)/(B.y-A.y)+A.x)n=!n;
    }return n;};
    for(let sy=-13;sy<=13;sy++)for(let sx=-19;sx<=19;sx++){
      if(inside(sx/19,sy/13)){
        // Distance to polygon boundary = luminous five-point silhouette.
        // The 2D star is then projected with 3D yaw and roll per frame.
        const x=sx/19,y=sy/13;
        let distance=Infinity;
        for(let i=0;i<10;i++){
          const A=pts[i],B=pts[(i+1)%10];
          const vx=B.x-A.x,vy=B.y-A.y;
          const u=clamp(((x-A.x)*vx+(y-A.y)*vy)/(vx*vx+vy*vy));
          distance=Math.min(distance,Math.hypot(x-A.x-vx*u,y-A.y-vy*u));
        }
        const outline=distance<.105;
        starShape.push({x:sx,y:sy,
          ch:outline?choose(['*','+','#']):choose(['@','%','#']),
          outline,phase:random()*TAU,seed:random()});
      }
    }
    // Three rings of golden dust orbit around the medium star in 3D, made
    // of punctuating characters; never paint a conventional SVG star.
    for(let i=0;i<120;i++){
      starDust.push({angle:random()*TAU,r:.35+random()*.85,
        skew:random()*.8+.3,phase:random()*TAU,
        rate:.22+random()*.58,seed:random()});
    }
  }

  function resize(){
    W=innerWidth;H=innerHeight;
    dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    g.setTransform(dpr,0,0,dpr,0,0);
    font=W<460?7.7:W<800?8.4:Math.min(11.9,Math.max(9.2,W/116));
    CW=font*.605;CH=font*1.04;
    ncols=Math.ceil(W/CW);nrows=Math.ceil(H/CH);
    scale=Math.min((H*(W<700?.71:.635))/SETTINGS.height, W*.163);
    // On a desktop leave room for a title below the gifts; on phones, use
    // more vertical space for the actual tree, with no cropping.
    center=W*.5;
    base=H*(W<700?.785:.824);
    const len=ncols*nrows;
    gridChars=new Array(len).fill('');
    gridColors=new Uint8Array(len);gridGlow=new Uint8Array(len);
    gridDepth=new Float32Array(len);
    gradient=g.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,'#050b14');gradient.addColorStop(.54,'#08131d');gradient.addColorStop(1,'#0a171d');
    velvetGlow=g.createRadialGradient(W/2,H*.52,0,W/2,H*.52,H*.8);
    velvetGlow.addColorStop(0,'rgba(31,68,71,.13)');
    velvetGlow.addColorStop(.55,'rgba(9,25,35,.035)');
    velvetGlow.addColorStop(1,'rgba(0,0,0,.4)');
    sky=[];ground=[];snow=[];floating=[];
    for(let i=0;i<SETTINGS.starsCount;i++){
      sky.push({x:random()*W,y:random()*H*.92,ch:choose(['.','.','+','*','.']),
        op:.08+.45*random(),phase:random()*TAU,tempo:.35+random()*.8});
    }
    for(let i=0;i<950;i++){
      const x=random()*W,y=base-20+random()*Math.max(20,H-base+30);
      ground.push({x,y,ch:choose(['.','.','.','-',':','+']),op:.035+.13*random()});
    }
    for(let i=0;i<SETTINGS.snowCount;i++){
      const near=random()<.23;
      snow.push({x:random()*W,y:random()*H,
        speed:(near?28:10)+random()*(near?40:22),
        wind:(random()-.5)*(near?22:11),phase:random()*TAU,
        op:.16+random()*(near?.65:.4),size:near?1.14:.75,
        char:choose(near?['+','*','.']:['.','.','.','+'])});
    }
    for(let i=0;i<58;i++){
      floating.push({start:7.65+random()*6.8,
        x:(random()-.5)*5.2,y:.4+random()*6.1,
        z:random()*1.4+.2,phase:random()*TAU,
        speed:.25+random()*.45});
    }
  }

  // Orthographic camera with depth shade and subtle breathing / parallax.
  function project(x,y,z){
    const tx=x*cosR+z*sinR;
    const tz=z*cosR-x*sinR;
    const f=1+tz*.023;
    return {x:center+tx*scale*f+mouseX*10*(y/SETTINGS.height),
      y:base-y*scale+tz*.092*scale+mouseY*6*(y/SETTINGS.height),z:tz};
  }
  function plot(px,py,z,ch,col,glow=0){
    const x=Math.round(px/CW),y=Math.round(py/CH);
    if(x<=0||y<=0||x>=ncols-1||y>=nrows-1)return;
    const k=y*ncols+x;
    if(z>=gridDepth[k]){
      gridDepth[k]=z;gridChars[k]=ch;gridColors[k]=col;gridGlow[k]=glow;
    }
  }
  function paintAmbient(t){
    g.fillStyle=gradient;g.fillRect(0,0,W,H);
    g.fillStyle=velvetGlow;g.fillRect(0,0,W,H);
    g.textAlign='center';g.textBaseline='middle';g.font=`${font}px Consolas, 'Courier New', monospace`;
    for(const s of sky){
      const flicker=.78+.22*Math.sin(t*s.tempo+s.phase);
      g.fillStyle=`rgba(195,215,224,${s.op*flicker})`;
      g.fillText(s.ch,s.x+mouseX*3,s.y+mouseY*3);
    }
    for(const s of ground){
      g.fillStyle=`rgba(175,209,194,${s.op})`;g.fillText(s.ch,s.x,s.y);
    }
    // Three independent snow depths, with gusts, parallax and unique speed.
    for(const s of snow){
      const x= ((s.x+t*s.wind+Math.sin(t*.72+s.phase)*14)%W+W)%W;
      const y= ((s.y+t*s.speed)%(H+25))-12;
      g.fillStyle=`rgba(233,244,249,${s.op*(.85+.15*Math.sin(t*2+s.phase))})`;
      g.font=`${font*s.size}px Consolas, 'Courier New', monospace`;
      g.fillText(s.char,x,y);
    }
    g.font=`${font}px Consolas, 'Courier New', monospace`;
  }

  /**
   * Paint a depth-sorted scene into the ASCII screen buffer.
   *
   * Character colour indices refer to COLORS above. Higher Z is nearer.
   * The screen buffer ensures branches, ribbons, ornaments and gifts share
   * the same crisp monospaced character grid without accidental overlap.
   * Every animation stage has its own transition window so REPLAY always
   * rebuilds the scene from darkness in a consistent order.
   */
  function paint3D(t){
    gridChars.fill('');
    gridDepth.fill(-999999);
    gridGlow.fill(0);
    const B=SETTINGS.beats;
    const growth=p(t,B.buildStart,B.buildEnd);
    const top=SETTINGS.height*growth;
    const wrapped=p(t,B.ribbonStart,B.ribbonEnd);
    const lights=p(t,B.lightsStart,B.lightsEnd);
    const rotationSpeed=TAU/SETTINGS.rotationSeconds;

    // Evergreen turns at a very slow constant rate even while growing.
    rotation=t*rotationSpeed;
    sinR=Math.sin(rotation);
    cosR=Math.cos(rotation);

    // ==============================================================
    // 01 / THE FOREST WAKES. The trunk appears first, then needles.
    // ==============================================================
    if(t>B.trunk){
      for(const n of trunk){
        const q=project(n.x,n.y,n.z);
        plot(q.x,q.y,q.z-.24,n.ch,12);
      }
    }

    // The first growth wave is nearly white, then fades to icy mint, then
    // settles to dark-to-bright emerald. A wake of lingering crystal glints
    // gives the impression of thousands of branches materialising.
    const front=.60;
    const frostTail=.87;
    const reflectionY=growth>.999 ? fract((t-6.45)/11)*SETTINGS.height : -10;
    const reflection2=growth>.999 ? fract((t-10.6)/15.7)*SETTINGS.height : -10;
    for(const n of tree){
      // Deliberate unevenness makes growth look organic, not like an
      // artificially straight horizontal clipping line.
      const wobble=.025*Math.sin(n.x*9+t*4+n.phase)+.045*(n.rand-.5);
      if(n.y>top+wobble)continue;
      const q=project(n.x,n.y,n.z);
      const depth=clamp((q.z+2.7)/5.7);
      const distance=top-n.y;
      const whiteWave=distance>=0 && distance<front;
      const intensity=whiteWave?1-distance/front:0;
      const trailing=distance>=front && distance<front+frostTail;
      const flicker=Math.sin(t*8+n.phase+4*n.y);
      let col=0,glow=0;

      if(whiteWave){
        if(intensity>.48){col=8;glow=3;}
        else if(intensity>.24){col=7;glow=2;}
        else {col=6;glow=1;}
      }else if(trailing && n.rand>.70 && flicker>.05){
        col=flicker>.70?8:7;
        glow=flicker>.70?2:1;
      }else if(n.frost){
        col=depth>.38?7:6;
        if(flicker>.92&&n.rand>.5)glow=2;
      }else{
        col=depth>.77?4:depth>.58?3:depth>.37?2:depth>.19?1:0;
        if(n.rand>.95 && depth>.4)col=5;
      }

      // Two pearl-white glistening sweeps recur, at different speeds and
      // thicknesses. Not every character participates, so they appear as
      // refracted light across pine needles rather than big white stripes.
      if(growth>.999){
        const d1=Math.abs(n.y-reflectionY);
        const d2=Math.abs(n.y-reflection2);
        if(d1<.24&&n.rand>.70){
          col=d1<.065?8:7;glow=d1<.065?3:1;
        }else if(d2<.14&&n.rand>.83){
          col=d2<.075?8:6;glow=1;
        }
      }
      plot(q.x,q.y,q.z,n.ch,col,glow);
    }

    // The advancing magic seam has scatterable ice flecks, tiny orbiting
    // crystal glyphs and a dazzling white central builder light.
    if(growth>.01 && growth<1){
      for(const n of frontCrystals){
        const age=top-n.y-n.delay;
        if(age<-.15||age>.64)continue;
        if(Math.sin(t*12+n.phase)<-.35)continue;
        const q=project(n.x,n.y+Math.sin(t*4+n.phase)*.026,n.z);
        plot(q.x,q.y,q.z+2,age<.19?'*':'+',age<.21?8:7,age<.29?3:1);
      }
      for(const n of tips){
        if(Math.abs(top-n.y)>.38)continue;
        if(Math.sin(t*15+n.phase)<.25)continue;
        const q=project(n.x,n.y,n.z);
        plot(q.x,q.y,q.z+1,n.seed>.55?'*':'+',8,2);
      }
      const r=radius(top);
      for(let i=0;i<38;i++){
        const a=i*2.39996+t*.85;
        const yy=top+.095+.21*Math.sin(t*3+i*1.7);
        const rr=r*(.81+.3*Math.sin(i*8.2+t));
        const q=project(Math.cos(a)*rr,yy,Math.sin(a)*rr);
        if(i%4===0||Math.sin(i*17+t*3)>.2){
          plot(q.x,q.y,30,i%3===0?'*':'+',i%2?8:7,i%4===0?3:2);
        }
      }
      // The white seed orb winds upward while laying the frosted fir.
      const a=t*4.8;
      const builder=project(Math.cos(a)*r*.69,top+.12,Math.sin(a)*r*.69);
      plot(builder.x,builder.y,45,'@',8,4);
      for(let k=0;k<6;k++){
        const aa=k*TAU/6+t*2;
        plot(builder.x+Math.cos(aa)*11,builder.y+Math.sin(aa)*10,
          44,'*',7,2);
      }
    }

    // ==============================================================
    // 02 / A RED SATIN RIBBON IS WOVEN IN 3D AROUND THE PINE.
    // ==============================================================
    if(wrapped>.001){
      for(const n of ribbon){
        if(n.q>wrapped)continue;
        const q=project(n.x,n.y,n.z);
        if(q.z<-.03)continue; // the far side stays behind the branches
        const golden=n.lane===-2||n.lane===2;
        const shine=Math.sin(t*6+n.q*39)>.78;
        const col=golden?(shine?15:14):(shine?11:10);
        plot(q.x,q.y,q.z+1.7,n.ch,col,golden&&(shine?2:1));
      }
      // A small warm-gold comet stitches the active ribbon endpoint.
      if(wrapped<.99){
        const yy=.68+wrapped*(SETTINGS.height-.98);
        const aa=wrapped*TAU*4.35+.38;
        const rr=radius(yy)+.15;
        const q=project(Math.cos(aa)*rr,yy,Math.sin(aa)*rr);
        for(let k=0;k<12;k++){
          const a=k*TAU/12+t*2.2;
          plot(q.x+Math.cos(a)*11,q.y+Math.sin(a)*9,30,
            k%2?'*':'+',15,k%3===0?3:1);
        }
        plot(q.x,q.y,35,'@',15,4);
      }
    }

    // ==============================================================
    // 03 / INDIVIDUAL LIGHT BALLS. 68 glass baubles and 116 pearls.
    // ==============================================================
    if(lights>.001){
      // First the small fairy lights chase along the red/gold winding.
      for(const led of fairyLights){
        if(lights<led.q*.80)continue;
        const q=project(led.x,led.y,led.z);
        if(q.z<-.05)continue;
        const phase=t*3.7+led.phase;
        const bright=Math.sin(phase)>.63;
        const fade=p(lights,led.q*.80,led.q*.80+.12);
        plot(q.x,q.y,q.z+2,bright?'*':'+',bright?15:led.color,
          fade>.9 && bright ? 3:1);
        if(bright && led.q*73%4<1){
          plot(q.x+CW,q.y-CH,25,'+',15,1);
        }
      }
      // Bigger glass baubles form clearly legible glowing ASCII spheres.
      for(const b of bulbs){
        const fade=p(lights,b.start*.86,b.start*.86+.17);
        if(fade<.01)continue;
        const q=project(b.x,b.y,b.z);
        if(q.z<-.07)continue; // ornaments do not shine through back
        const pulse=.5+.5*Math.sin(t*b.rate+b.phase);
        const champagne=b.color===13||b.color===14;
        const hot=champagne?15:b.color===10?11:b.color===16?17:
          b.color===18?19:b.color===20?21:15;
        const col=pulse>.58?hot:b.color;
        const halo=b.size===2?2:b.size===1?1:0;
        const gain=fade>.82?1:0;

        // The tiny highlight, glass body, and shadow share one ASCII sphere.
        plot(q.x,q.y,q.z+2,'@',col,2+gain);
        plot(q.x,q.y-CH,q.z+2.1,'+',hot,2);
        if(b.size>=1){
          plot(q.x-CW,q.y,q.z+2.1,'o',b.color,1);
          plot(q.x+CW,q.y,q.z+2.1,'o',b.color,1);
          plot(q.x,q.y+CH,q.z+2.1,'o',b.color,1);
        }
        if(halo>=2){
          // Antique glass sparkle: a six-glyph circular twinkling rim.
          for(let k=0;k<6;k++){
            const a=k*TAU/6+t*.30+b.flare;
            const dist=1.7;
            plot(q.x+Math.cos(a)*CW*dist,
              q.y+Math.sin(a)*CH*dist,q.z+2,
              k%2?'.':'+',k%3===0?hot:b.color,1);
          }
        }
        if(pulse>.86&&fade>.80){
          plot(q.x+CW*1.8,q.y-CH*1.7,25,'*',hot,2);
          if(b.size===2)plot(q.x-CW*2,q.y+CH*1.2,25,'+',hot,1);
        }
      }
    }

    // Extra rare flickers seem to float just beyond the foliage, creating
    // a deep sparkling 3D atmosphere without overwhelming the little balls.
    if(t>B.lightsStart){
      for(const s of branchSparks){
        const q=project(s.x,s.y,s.z);
        if(q.z<0)continue;
        const flash=Math.sin(t*s.rate*4+s.phase);
        if(flash>.935){
          plot(q.x,q.y,q.z+3,'*',s.phase%2<1?15:7,2);
        }
      }
    }

    // ==============================================================
    // 04 / THREE SMALL GIFTS, TWO LEFT, ONE RIGHT, DIFFERENT SIZES.
    // ==============================================================
    if(t>=B.giftsStart){
      boxes.forEach((box,i)=>{
        const birth=B.giftsStart+i*.67;
        const q=p(t,birth,birth+.95);
        if(q<=0)return;
        // A quick, gentle rising bounce; gifts do not rotate with the tree.
        const spring=(1-q)*.1*Math.sin(q*Math.PI*2.4);
        const drop=(1-q)*.20;
        const pop=.90+.10*ease(q)+spring;
        for(const v of box.voxels){
          const x=center+(v.x+.12*v.z)*scale;
          const y=base+scale*(.09+.032*v.z)-(v.y*pop-drop)*scale;
          plot(x,y,40+v.z,v.ch,v.col,
            (v.col===14||v.col===19||v.col===23)?1:0);
        }
        // Crisp front-face frame, lid and centre ribbon. This makes all
        // three PETITE presents readable even on a narrow phone screen,
        // rather than looking like red/green patches on the tree.
        const o=box.location;
        const zFace=o.z+o.d*.5;
        const xc=center+(o.x+.12*zFace)*scale;
        const bottom=base+scale*(.09+.032*zFace)+drop*scale;
        const topY=bottom-o.h*pop*scale;
        const left=xc-o.w*scale*.5;
        const right=xc+o.w*scale*.5;
        const centreY=(topY+bottom)*.5;
        const frameColor=o.edge;
        const bandColor=o.band;
        const cellsX=Math.max(4,Math.round((right-left)/CW));
        const cellsY=Math.max(3,Math.round((bottom-topY)/CH));
        for(let j=0;j<=cellsX;j++){
          const xx=left+(right-left)*j/cellsX;
          plot(xx,topY,83,j===0||j===cellsX?'+':'=',frameColor,1);
          plot(xx,bottom,83,j===0||j===cellsX?'+':'-',frameColor,0);
        }
        for(let k=1;k<cellsY;k++){
          const yy=topY+(bottom-topY)*k/cellsY;
          plot(left,yy,83,'|',frameColor,1);
          plot(right,yy,83,'|',frameColor,1);
          plot(xc,yy,84,'@',bandColor,1);
        }
        // Bow: two clear loops and a glittering gift-knot.
        plot(xc-CW,topY-CH*.75,86,'(',bandColor,2);
        plot(xc+CW,topY-CH*.75,86,')',bandColor,2);
        plot(xc,topY-CH*.63,87,'*',15,3);
        plot(xc,centreY,85,'@',bandColor,1);

        // Soft small-scale gift pop: no oversized fireworks.
        if(q>.05&&q<.92){
          for(let k=0;k<11;k++){
            const a=k*TAU/11+i*.7;
            const rr=5+22*ease(q);
            const cx=center+(box.location.x+.12*box.location.z)*scale;
            const cy=base-box.location.h*scale*.76;
            plot(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,
              70,k%3===0?'*':'+',k%2===0?15:7,2);
          }
        }
      });
    }

    // ==============================================================
    // 05 / FLOATING WINTER LIGHTS AND THE ASCENDING GOLD COMET.
    // ==============================================================
    for(const s of floating){
      if(t<s.start)continue;
      const life=t-s.start;
      const a=s.phase+t*s.speed;
      const orbit=radius(s.y)+.50+.14*Math.sin(a*3);
      const q=project(Math.cos(a)*orbit,s.y+.1*Math.sin(t+s.phase),
        Math.sin(a)*orbit);
      if(q.z<0)continue;
      plot(q.x,q.y,q.z+1,Math.sin(t*5+s.phase)>.6?'*':'+',
        s.start>11.6?15:7,life<.55?1:2);
    }

    const comet=p(t,B.cometStart,B.starStart+.15);
    const starOn=p(t,B.starStart,B.starEnd);
    // Star sits a little above the tip, at a medium rather than giant size.
    const starPt=project(0,SETTINGS.height+.52,0);
    if(comet>.001&&comet<1){
      const fromY=base+7;
      const y=fromY+(starPt.y-fromY)*ease(comet);
      const x=center+Math.sin(comet*TAU*2)*scale*.22*(1-comet);
      // A dotted golden comet tail spirals upward into the fir crown.
      for(let i=0;i<26;i++){
        const lag=i/26*.38;
        const tt=clamp(comet-lag);
        if(tt<=0)continue;
        const ty=fromY+(starPt.y-fromY)*ease(tt);
        const tx=center+Math.sin(tt*TAU*2)*scale*.22*(1-tt);
        plot(tx,ty,90,i<5?'*':'+',i<6?15:14,i<9?3:1);
      }
      for(let i=0;i<14;i++){
        const a=i*TAU/14+t*2.6;
        const rr=6+4*Math.sin(comet*Math.PI);
        plot(x+Math.cos(a)*rr,y+Math.sin(a)*rr,100,
          i%2?'*':'+',i%3===0?8:15,3);
      }
      plot(x,y,110,'@',15,4);
    }

    // ==============================================================
    // 06 / MEDIUM GOLDEN ROTATING STAR. ACTUAL STAR BODY ROTATES.
    // ==============================================================
    if(starOn>.001){
      // Y-axis turn creates a 3D flip; Z-axis turn rotates the points.
      // Face remains slightly visible at its narrowest to avoid flicker.
      // A true 360-degree spin in the picture plane preserves the five
      // points. A gentle independent 3D sway gives faceted depth.
      const yaw=t*TAU/SETTINGS.starRollSeconds;
      // Hold the clearly recognizable upright five-point silhouette for
      // the initial reveal, then ease into a continuous full 360-degree turn.
      const spinAge=Math.max(0,t-(B.starEnd+1.2));
      const spunTime=spinAge<2 ? spinAge*spinAge/4 : spinAge-1;
      const roll=spunTime*TAU/SETTINGS.starRotationSeconds;
      const cosYaw=Math.cos(yaw);
      const faceWidth=.86+.14*Math.abs(cosYaw);
      const ca=Math.cos(roll),sa=Math.sin(roll);
      const factor=(W<500?.40:.325)*ease(starOn);
      const glitter=Math.sin(t*4.4);

      // ASCII-only star fill, animated with warm gold depth shading.
      for(const s of starShape){
        const xx=s.x*CW*factor*1.15;
        const yy=s.y*CH*factor*.86;
        const rotatedX=xx*ca-yy*sa;
        const rotatedY=xx*sa+yy*ca;
        const side=rotatedX*cosYaw;
        const sx=starPt.x+rotatedX*faceWidth;
        const sy=starPt.y+rotatedY;
        const flick=Math.sin(t*5.3+s.phase+s.x*.11-s.y*.15);
        const col=s.outline?(flick>.45?8:15):
          s.seed>.96&&flick>.44?8:
          flick>.82?15:s.seed>.3?14:13;
        const glow=s.outline?3:(col===8||col===15)?3:2;
        plot(sx,sy,112+side*.01,s.ch,col,glow);
      }
      // Trace each of the ten star edges in gold ASCII symbols. This keeps
      // all five points sharply readable as the character mask rotates,
      // even where several filled glyphs map to a single screen cell.
      const outlineVertices=[];
      for(let i=0;i<10;i++){
        const a=-Math.PI/2+i*Math.PI/5;
        const radial=i%2===0?1:.42;
        const xx=Math.cos(a)*radial*19*CW*factor*1.15;
        const yy=Math.sin(a)*radial*13*CH*factor*.86;
        outlineVertices.push({
          x:starPt.x+(xx*ca-yy*sa)*faceWidth,
          y:starPt.y+xx*sa+yy*ca
        });
      }
      for(let i=0;i<10;i++){
        const A=outlineVertices[i],D=outlineVertices[(i+1)%10];
        const distance=Math.hypot(A.x-D.x,A.y-D.y);
        const steps=Math.max(3,Math.ceil(distance/3));
        for(let j=0;j<=steps;j++){
          const u=j/steps;
          const x=A.x+(D.x-A.x)*u;
          const y=A.y+(D.y-A.y)*u;
          const isTip=(i%2===0 && j===0);
          plot(x,y,114,isTip?'*':'+',isTip?8:15,isTip?4:3);
        }
      }
      // A small orbiting constellation of isolated gold characters rotates
      // independently of the star body and gives it an airy luminous aura.
      if(starOn>.38){
        const fade=p(starOn,.38,1);
        const outer=W<500?25:32;
        for(let i=0;i<starDust.length;i++){
          const d=starDust[i];
          const a=d.angle+t*d.rate;
          const rr=outer*d.r*fade;
          const ell=.65+.35*Math.sin(yaw+d.phase);
          const xx=starPt.x+Math.cos(a)*rr*ell;
          const yy=starPt.y+Math.sin(a)*rr*.76;
          const twinkle=Math.sin(t*6+d.phase+i);
          if(twinkle>.62 || i%11===0){
            plot(xx,yy,116,d.seed>.68?'*':'+',d.seed>.82?8:15,
              d.seed>.9?3:1);
          }
        }
        // A bright rotating four-point star flare at the ignition core.
        for(let i=0;i<8;i++){
          const a=i*TAU/8+t*.58;
          const rr=(W<500?17:24)+3*Math.sin(t*2+i);
          plot(starPt.x+Math.cos(a)*rr,starPt.y+Math.sin(a)*rr*.77,
            118,i%2?'*':'+',i%3===0?8:15,2);
        }
      }
      // At first ignition a ring of glowing punctuation expands then
      // disappears. Converges into the persistent spinning star.
      if(t<B.starEnd+.84){
        const spread=p(t,B.starStart+.33,B.starEnd+.84);
        for(let k=0;k<28;k++){
          const a=k*TAU/28;
          const rr=spread*(W<500?55:76);
          plot(starPt.x+Math.cos(a)*rr,
            starPt.y+Math.sin(a)*rr*.79,120,
            k%3===0?'*':'+',spread>.65?14:8,spread>.75?1:2);
        }
      }
      // A long-lived gentle glint radiates across the tree after ignition.
      if(t>B.starEnd){
        const sweep=fract((t-B.starEnd)/9.3);
        for(let i=0;i<24;i++){
          const a=i*2.39996+t*.16;
          const y=SETTINGS.height*(1-sweep)+.12*Math.sin(i+t);
          const rr=radius(clamp(y,.05,SETTINGS.height))*(.65+.35*Math.sin(i*1.2));
          const q=project(Math.cos(a)*rr,y,Math.sin(a)*rr);
          if(q.z>0)plot(q.x,q.y,25,i%3?'*':'+',i%3?7:15,1);
        }
      }
    }
  }

  function drawGlyphs(){
    g.font=`${font}px Consolas, 'Courier New', monospace`;
    g.textAlign='center';g.textBaseline='middle';
    let old=-1;
    for(let i=0;i<gridChars.length;i++){
      if(!gridChars[i])continue;
      const c=gridColors[i];
      if(c!==old){g.fillStyle=COLORS[c];old=c;}
      g.fillText(gridChars[i],i%ncols*CW,Math.floor(i/ncols)*CH);
    }
    g.save();
    for(let i=0;i<gridChars.length;i++){
      if(!gridGlow[i])continue;
      const c=gridColors[i],v=gridGlow[i];
      g.fillStyle=COLORS[c];
      g.shadowColor=c>=9&&c<=11?'#f65c78':c>=16&&c<=17?'#a6edff':
        c>=12&&c<=15?'#ffe5a2':'#e5fff7';
      g.shadowBlur=font*(v===4?3.2:v*1.4);
      g.fillText(gridChars[i],i%ncols*CW,Math.floor(i/ncols)*CH);
    }
    g.restore();
  }
  function updateUI(t){
    const b=SETTINGS.beats;
    const names=[
      [b.ribbonStart,'01','FROST GROWS INTO GREEN'],
      [b.lightsStart,'02','A RIBBON OF GOLD'],
      [b.giftsStart,'03','A THOUSAND TINY LIGHTS'],
      [b.cometStart,'04','THREE LITTLE GIFTS'],
      [b.textStart,'05','THE GOLDEN STAR AWAKENS'],
      [Infinity,'06','ALL IS BRIGHT']
    ];
    const value=names.find(v=>t<v[0]);
    const stageIndex=names.indexOf(value);
    if(stageIndex!==lastStage){stage.innerHTML=`<em>${value[1]}</em> &nbsp; ${value[2]}`;lastStage=stageIndex;}
    stage.classList.toggle('done',t>=b.textStart);
    footer.classList.toggle('visible',t>=b.textStart);
    loading.style.width=`${(100*clamp(t/b.textStart)).toFixed(2)}%`;
    loading.parentElement.style.opacity=t>=b.textStart?'.10':'1';
  }
  function render(t){paintAmbient(t);paint3D(t);drawGlyphs();updateUI(t);renderNumber++;}
  function frame(now){
    requestAnimationFrame(frame);
    if(!previous)previous=now;
    const dt=Math.min(.12,(now-previous)/1000);
    previous=now;
    if(!playing)return;
    tick+=dt;
    if(now-lastRender<1000/SETTINGS.targetFPS)return;
    lastRender=now;
    render(tick);
  }
  function replay(){tick=0;playing=true;pauseBtn.textContent='PAUSE';previous=performance.now();lastRender=0;render(0);}
  function toggle(){playing=!playing;pauseBtn.textContent=playing?'PAUSE':'RESUME';previous=performance.now();}
  replayBtn.addEventListener('click',replay);
  pauseBtn.addEventListener('click',toggle);
  window.addEventListener('resize',()=>{resize();render(tick);});
  window.addEventListener('pointermove',e=>{mouseX=clamp((e.clientX/innerWidth-.5)*2,-1,1);mouseY=clamp((e.clientY/innerHeight-.5)*2,-1,1);},{passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='r')replay();
    if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle();}
  });
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    // Respect the preference on first load while still permitting replay.
    tick=16;playing=false;pauseBtn.textContent='RESUME';
  }
  // Useful for testing, video recording, or opening a specific animation beat.
  window.ASCIIChristmas={
    seek(sec){tick=Math.max(0,Number(sec)||0);render(tick);},
    replay,pause:toggle,
    get time(){return tick;},
    get giftCount(){return boxes.length;},
    get frame(){return renderNumber;}
  };

  // Music
  const music = document.getElementById("bg-music");
  if (music) {
    music.volume = 0.45;
    music.play().catch(() => {
      document.body.addEventListener("click", () => music.play(), { once: true });
      document.body.addEventListener("touchstart", () => music.play(), { once: true });
    });
  }

  constructTree();resize();render(tick);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
