<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corazón de Partículas</title>
  <link rel="stylesheet" href="corazon-particulas.css">
</head>
<body>
  <audio id="bg-music" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <svg viewBox="0 0 600 552" style="display:none">
    <path d="M300,107.77C284.68,55.67,239.76,0,162.31,0,64.83,0,0,82.08,0,171.71c0,.48,0,.95,0,1.43-.52,19.5,0,217.94,299.87,379.69v0l0,0,.05,0,0,0,0,0v0C600,391.08,600.48,192.64,600,173.14c0-.48,0-.95,0-1.43C600,82.08,535.17,0,437.69,0,360.24,0,315.32,55.67,300,107.77" fill="#ee5282"/>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="corazon-particulas.js"></script>
  <script>
    // Music
    const music = document.getElementById("bg-music");
    if (music) {
      music.volume = 0.4;
      music.play().catch(() => {
        document.body.addEventListener("click", () => music.play(), { once: true });
        document.body.addEventListener("touchstart", () => music.play(), { once: true });
      });
    }
  </script>
</body>
</html>
